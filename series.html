<html lang="fr" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="PROJET_TM/Films/premium-home.css">
    <style>
        /* Grille Ultra-Responsive */
        .movie-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
            gap: 20px;
            padding: 20px 0;
            width: 100%;
        }
        @media (min-width: 2560px) { .movie-grid { grid-template-columns: repeat(10, 1fr); } }
        @media (min-width: 2200px) and (max-width: 2559px) { .movie-grid { grid-template-columns: repeat(9, 1fr); } }
        @media (min-width: 1920px) and (max-width: 2199px) { .movie-grid { grid-template-columns: repeat(8, 1fr); } }
        @media (min-width: 1650px) and (max-width: 1919px) { .movie-grid { grid-template-columns: repeat(7, 1fr); } }
        @media (min-width: 1400px) and (max-width: 1649px) { .movie-grid { grid-template-columns: repeat(6, 1fr); } }
        @media (min-width: 1150px) and (max-width: 1399px) { .movie-grid { grid-template-columns: repeat(5, 1fr); } }
        @media (min-width: 900px) and (max-width: 1149px) { .movie-grid { grid-template-columns: repeat(4, 1fr); } }
        @media (min-width: 650px) and (max-width: 899px) { .movie-grid { grid-template-columns: repeat(3, 1fr); } }
        @media (max-width: 649px) { .movie-grid { grid-template-columns: repeat(2, 1fr); gap: 12px; } }


        .movie-grid .premium-card {
            width: 100% !important;
            max-width: none !important;
            min-width: 0 !important;
        }
        .text-accent { color: #a78bfa !important; }
        .cat-tag {
            padding: 8px 20px;
            background: var(--card-bg, rgba(255,255,255,0.08));
            border: 1px solid var(--border, rgba(255,255,255,0.15));
            border-radius: 50px;
            color: var(--text-primary, #ffffff) !important;
            text-decoration: none !important;
            font-weight: 700;
            font-size: 0.8rem;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .cat-tag:hover {
            border-color: var(--accent);
            color: var(--accent) !important;
            transform: translateY(-2px);
        }

        .cat-tag.active {
            background: linear-gradient(135deg, #a78bfa, #8b5cf6) !important;
            color: #ffffff !important;
            border-color: transparent !important;
            box-shadow: 0 4px 14px rgba(139, 92, 246, 0.45);
        }
    </style>
    <link rel="stylesheet" href="PROJET_TM/Films/theme-variables.css">
</head>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const API_KEY = "04c35731a5ee918f014970082a0088b1";
    const BASE_URL = "https://api.themoviedb.org/3";
    const IMG_URL = "https://image.tmdb.org/t/p/w500";
    const BACKDROP_URL = "https://image.tmdb.org/t/p/original";

    const laneStates = {
        'popular-series': { page: 1, endpoint: '/tv/popular', params: '' },
        'top-rated-series': { page: 1, endpoint: '/tv/top_rated', params: '' },
        'action-series': { page: 1, endpoint: '/discover/tv', params: '&with_genres=10759' }
    };

    async function loadSeriesHome() {
        try {
            await loadDefaultSeriesLanes();
            setupSeriesSearchAndFilters();
        } catch(e) { console.error(e); }
    }

    async function loadDefaultSeriesLanes() {
        const [popular, topRated, action] = await Promise.all([
            fetch(`${BASE_URL}${laneStates['popular-series'].endpoint}?api_key=${API_KEY}&language=${localStorage.getItem('user_lang') || 'fr-FR'}&page=1`).then(r => r.json()),
            fetch(`${BASE_URL}${laneStates['top-rated-series'].endpoint}?api_key=${API_KEY}&language=${localStorage.getItem('user_lang') || 'fr-FR'}&page=1`).then(r => r.json()),
            fetch(`${BASE_URL}${laneStates['action-series'].endpoint}?api_key=${API_KEY}&language=${localStorage.getItem('user_lang') || 'fr-FR'}&with_genres=10759&page=1`).then(r => r.json())
        ]);

        if (popular.results && popular.results[0]) {
            document.getElementById('series-hero-img').src = BACKDROP_URL + popular.results[0].backdrop_path;
        }

        renderLane(popular.results, 'popular-series');
        renderLane(topRated.results, 'top-rated-series');
        renderLane(action.results, 'action-series');
    }

    async function loadMore(laneId) {
        const state = laneStates[laneId];
        if (!state || state.loading) return;

        const container = document.getElementById(laneId);
        if (!container) return;

        state.loading = true;

        const titleBtn = document.querySelector(`button[onclick="loadMore('${laneId}')"]`);
        if (titleBtn) titleBtn.innerHTML = `<span class="spinner-border spinner-border-sm"></span>...`;

        state.page++;
        try {
            const res = await fetch(`${BASE_URL}${state.endpoint}?api_key=${API_KEY}&language=${localStorage.getItem('user_lang') || 'fr-FR'}${state.params}&page=${state.page}`).then(r => r.json());
            if (res.results && res.results.length > 0) {
                appendCards(res.results, laneId);
            } else {
                if (titleBtn) titleBtn.style.display = 'none';
                const vCard = container.querySelector('.view-more-card');
                if (vCard) vCard.remove();
                notify("Plus de résultats", "info");
            }
        } catch(e) { console.error(e); state.page--; }
        finally {
            state.loading = false;
            if (titleBtn) titleBtn.innerHTML = `VOIR PLUS <i class="ph ph-plus"></i>`;
        }
    }

    function renderLane(data, elementId) {
        const container = document.getElementById(elementId);
        if (!container) return;
        let html = generateCardsHTML(data);

        if (laneStates[elementId]) {
            html += `
                <div class="premium-card d-flex align-items-center justify-content-center view-more-card" style="background: rgba(255,255,255,0.03); border: 2px dashed var(--border); cursor: pointer;" onclick="loadMore('${elementId}')">
                    <div class="text-center">
                        <i class="ph ph-plus-circle fs-1 mb-2 text-accent"></i>
                        <div class="fw-bold small">VOIR PLUS</div>
                    </div>
                </div>
            `;
        }

        container.innerHTML = html;
    }

    function appendCards(data, elementId) {
        const container = document.getElementById(elementId);
        if (!container) return;

        const viewMoreCard = container.querySelector('.view-more-card');
        const html = generateCardsHTML(data);

        if (viewMoreCard) {
            viewMoreCard.insertAdjacentHTML('beforebegin', html);
        } else {
            container.insertAdjacentHTML('beforeend', html);
        }
    }

    function generateCardsHTML(data) {
        const includeAdult = localStorage.getItem("include_adult") === "true";
        data = data.filter(item => {
            if (includeAdult) return true;
            return item.adult !== true;
        });

        return data.map(item => `
            <div class="premium-card" onclick="window.location.href='PROJET_TM/Films/serie-details.html?id=${item.id}'">
                <img src="${item.poster_path ? IMG_URL + item.poster_path : 'https://via.placeholder.com/220x330?text=No+Image'}" loading="lazy">
                <div class="card-details">
                    <div class="card-title">${item.name}</div>
                    <div class="card-meta">
                        <span class="rating-badge">
                            <i class="ph-fill ph-star"></i> ${item.vote_average ? item.vote_average.toFixed(1) : '0.0'}
                        </span>
                        <span class="opacity-75">${item.first_air_date ? new Date(item.first_air_date).getFullYear() : 'N/A'}</span>
                    </div>
                </div>
            </div>
        `).join('');
    }

    function setupSeriesSearchAndFilters() {
        const searchInput = document.getElementById('series-search');
        const searchSection = document.getElementById('series-search-results-section');
        const genreTags = document.querySelectorAll('#series-genre-filters .cat-tag');

        let searchTimeout;
        searchInput.addEventListener('input', (e) => {
            clearTimeout(searchTimeout);
            const query = e.target.value.trim();
            
            if (query.length < 2) {
                searchSection.style.display = 'none';
                return;
            }

            searchTimeout = setTimeout(async () => {
                const includeAdult = localStorage.getItem("include_adult") === "true";
                const res = await fetch(`${BASE_URL}/search/tv?api_key=${API_KEY}&language=${localStorage.getItem('user_lang') || 'fr-FR'}&query=${encodeURIComponent(query)}&include_adult=${includeAdult}`).then(r => r.json());
                if (res.results && res.results.length > 0) {
                    searchSection.style.display = 'block';
                    renderLane(res.results, 'series-search-results');
                }
            }, 500);
        });

        const btnApply = document.getElementById('btn-apply-filters');

        btnApply.onclick = async () => {
            const genreSelect = document.getElementById('filter-genre');
            const genreId = genreSelect.value;
            const genreName = genreSelect.options[genreSelect.selectedIndex].text;
            const year = document.getElementById('filter-year').value;
            const platform = document.getElementById('filter-platform').value;
            const sort = document.getElementById('filter-sort').value;
            const origin = document.getElementById('filter-origin').value;

            let queryParams = `api_key=${API_KEY}&language=${localStorage.getItem('user_lang') || 'fr-FR'}&sort_by=${sort}`;
            if (genreId) queryParams += `&with_genres=${genreId}`;
            if (year) queryParams += `&first_air_date_year=${year}`;
            if (platform) queryParams += `&with_networks=${platform}`;
            if (origin) queryParams += `&with_origin_country=${origin}`;

            laneStates['popular-series'].endpoint = '/discover/tv';
            laneStates['popular-series'].params = `&sort_by=${sort}${genreId ? '&with_genres='+genreId : ''}${year ? '&first_air_date_year='+year : ''}${platform ? '&with_networks='+platform : ''}${origin ? '&with_origin_country='+origin : ''}`;
            laneStates['popular-series'].page = 1;

            const res = await fetch(`${BASE_URL}/discover/tv?${queryParams}`).then(r => r.json());
            const titleEl = document.querySelector('.lane-title');
            if (titleEl) {
                titleEl.textContent = (genreId || year || platform || origin) ? "SÉRIES FILTRÉES" : "SÉRIES LES PLUS POPULAIRES";
            }
            renderLane(res.results, 'popular-series');
            titleEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
        };
    }

    function notify(msg, type) {
        const c = document.getElementById("toast-container") || document.body;
        const t = document.createElement("div");
        t.className = `toast show bg-${type} text-theme p-3 mb-2 rounded-4 shadow-lg position-fixed bottom-0 end-0 m-4`;
        t.style.zIndex = "9999";
        t.textContent = msg;
        document.body.appendChild(t);
        setTimeout(() => t.remove(), 4000);
    }

    window.onscroll = () => {
        const nav = document.querySelector('.navbar');
        if (window.scrollY > 50) nav.classList.add('scrolled');
        else nav.classList.remove('scrolled');
    };

    if (document.readyState === "loading") {
        document.addEventListener('DOMContentLoaded', loadSeriesHome);
    } else {
        loadSeriesHome();
    }
</script>
<script src="PROJET_TM/theme.js"></script>
</body>
