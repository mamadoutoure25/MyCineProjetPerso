    <div class="form-container">
        <h1 class="form-title">Supprimer un film</h1>
        <div id="alert-container" class="mb-3"></div>
        <form id="deleteFilmForm">
            <div class="mb-3">
                <label for="film_select" class="form-label required">Sélectionner un film</label>
                <select class="form-select" id="film_select" name="film_id" required>
                    <option value="">Choisissez un film...</option>
                    <!-- Options remplies dynamiquement -->
                </select>
            </div>
            <div class="d-grid gap-2">
                <button type="submit" class="btn btn-danger">Supprimer le film</button>
            </div>
        </form>
    </div>
</main>
