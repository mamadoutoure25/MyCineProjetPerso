<!-- Contenu principal -->
<main class="container mt-5 pt-4">
  <div class="form-container">
    <h1 class="form-title">Ajouter un nouveau film</h1>
    <div id="alert-container" class="mb-3"></div>
    <form id="filmForm">
      <div class="row mb-3">
        <div class="col-md-6">
          <label for="tmdb_id" class="form-label required">ID TMDB</label>
          <input type="number" class="form-control" id="tmdb_id" name="tmdb_id" required>
          <button type="button" class="btn btn-secondary btn-sm tmdb-lookup" onclick="fetchTMDBData()">Récupérer depuis TMDB</button>
        </div>
        <div class="col-md-6">
          <label for="titre" class="form-label required">Titre</label>
          <input type="text" class="form-control" id="titre" name="titre" required>
        </div>
      </div>
      <div class="row mb-3">
        <div class="col-md-6">
          <label for="titre_original" class="form-label">Titre original</label>
          <input type="text" class="form-control" id="titre_original" name="titre_original">
        </div>
        <div class="col-md-6">
          <label for="langue_originale" class="form-label">Langue originale (ex: en, fr)</label>
          <input type="text" class="form-control" id="langue_originale" name="langue_originale" maxlength="10">
        </div>
      </div>
      <div class="mb-3">
        <label for="description" class="form-label">Description courte</label>
        <textarea class="form-control" id="description" name="description" rows="2"></textarea>
      </div>
      <div class="mb-3">
        <label for="synopsis" class="form-label">Synopsis complet</label>
        <textarea class="form-control" id="synopsis" name="synopsis" rows="4"></textarea>
      </div>
      <div class="row mb-3">
        <div class="col-md-4">
          <label for="date_sortie" class="form-label">Date de sortie</label>
          <input type="date" class="form-control" id="date_sortie" name="date_sortie">
        </div>
        <div class="col-md-4">
          <label for="duree" class="form-label">Durée (minutes)</label>
          <input type="number" class="form-control" id="duree" name="duree" min="0">
        </div>
        <div class="col-md-4">
          <label for="annee" class="form-label">Année de production</label>
          <input type="number" class="form-control" id="annee" name="annee" min="1900" max="2100">
        </div>
      </div>
      <div class="row mb-3">
        <div class="col-md-6">
          <label for="poster_path" class="form-label">Chemin de l'affiche</label>
          <input type="text" class="form-control" id="poster_path" name="poster_path">
        </div>
        <div class="col-md-6">
          <label for="backdrop_path" class="form-label">Chemin de l'image de fond</label>
          <input type="text" class="form-control" id="backdrop_path" name="backdrop_path">
        </div>
      </div>
      <div class="row mb-3">
        <div class="col-md-4">
          <label for="note_moyenne" class="form-label">Note moyenne (0-10)</label>
          <input type="number" class="form-control" id="note_moyenne" name="note_moyenne" step="0.1" min="0" max="10">
        </div>
        <div class="col-md-4">
          <label for="popularite" class="form-label">Popularité</label>
          <input type="number" class="form-control" id="popularite" name="popularite" step="0.01" min="0">
        </div>
        <div class="col-md-4">
          <label for="genres" class="form-label">Genres</label>
          <select class="form-select" id="genres" name="genres[]" multiple>
            <!-- Les options seront remplies dynamiquement -->
          </select>
        </div>
      </div>
      <div class="row mb-3">
        <div class="col-md-4">
          <label for="realisateur" class="form-label">Réalisateur</label>
          <input type="text" class="form-control" id="realisateur" name="realisateur">
        </div>
        <div class="col-md-4">
          <label for="status" class="form-label">Statut</label>
          <select class="form-select" id="status" name="status">
            <option value="Released">Sorti</option>
            <option value="Rumored">Rumeur</option>
            <option value="Planned">Planifié</option>
            <option value="In Production">En production</option>
            <option value="Post Production">Post-production</option>
            <option value="Canceled">Annulé</option>
          </select>
        </div>
        <div class="col-md-4">
          <label for="tagline" class="form-label">Tagline</label>
          <input type="text" class="form-control" id="tagline" name="tagline">
        </div>
      </div>
      <div class="row mb-3">
        <div class="col-md-6">
          <label for="trailer_url" class="form-label">URL de la bande-annonce</label>
          <input type="url" class="form-control" id="trailer_url" name="trailer_url">
        </div>
        <div class="col-md-6">
          <label for="acteurs" class="form-label">Acteurs principaux</label>
          <select class="form-select" id="acteurs" name="acteurs[]" multiple>
            <!-- Les options seront remplies dynamiquement -->
          </select>
        </div>
      </div>
      <div class="row mb-3">
        <div class="col-md-6">
          <label for="homepage" class="form-label">Site officiel</label>
          <input type="url" class="form-control" id="homepage" name="homepage">
        </div>
        <div class="col-md-6">
          <label for="imdb_id" class="form-label">ID IMDb</label>
          <input type="text" class="form-control" id="imdb_id" name="imdb_id" maxlength="20">
        </div>
      </div>
      <div class="row mb-3">
        <div class="col-md-6">
          <label for="video" class="form-label">Vidéo</label>
          <select class="form-select" id="video" name="video">
            <option value="0">Non</option>
            <option value="1">Oui</option>
          </select>
        </div>
      </div>
      <div class="d-grid gap-2">
        <button type="submit" class="btn btn-primary">Ajouter le film</button>
      </div>
    </form>
  </div>
</main>
