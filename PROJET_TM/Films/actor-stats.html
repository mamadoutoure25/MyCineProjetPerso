<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Statistiques des Acteurs - MyCiné</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="projet.css">
    <link rel="stylesheet" href="profilUser.css">
    <style>
        .stats-container {
            padding: 2rem 0;
        }
        .chart-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: var(--border-radius-lg);
            padding: 2rem;
            height: 100%;
            box-shadow: var(--shadow);
            transition: transform 0.3s ease;
        }
        .chart-card:hover {
            transform: translateY(-5px);
        }
        .chart-title {
            font-family: 'Playfair Display', serif;
            font-size: 1.5rem;
            margin-bottom: 2rem;
            text-align: center;
            color: var(--text);
        }
        .stat-summary {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.5rem;
            margin-bottom: 3rem;
        }
        .summary-item {
            background: var(--profile-gradient);
            padding: 1.5rem;
            border-radius: 16px;
            color: white;
            text-align: center;
            box-shadow: 0 4px 15px rgba(245, 158, 11, 0.2);
        }
        .summary-value {
            display: block;
            font-size: 2.5rem;
            font-weight: 800;
            line-height: 1;
            margin-bottom: 0.5rem;
        }
        .summary-label {
            font-size: 1rem;
            opacity: 0.9;
            font-weight: 500;
        }
        canvas {
            max-height: 350px;
        }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg fixed-top">
    <div class="container-fluid">
        <a class="navbar-brand d-flex align-items-center" href="../../index.html">
            <div class="logo-container me-2">
                <span class="logo-text">M</span>
            </div>
            <span class="brand-text d-none d-sm-inline">MyCiné</span>
        </a>
        <div class="collapse navbar-collapse" id="navbarContent">
            <ul class="navbar-nav me-auto">
                <li class="nav-item">
                    <a class="nav-link" href="profilUser.html">
                        <i class="ph ph-arrow-left me-1"></i> Retour au Profil
                    </a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<main class="container stats-container mt-5 pt-5">
    <header class="section-header mb-5">
        <h1 class="section-title">
            <span class="title-icon"><i class="ph ph-chart-pie"></i></span>
            Statistiques de vos Acteurs Favoris
        </h1>
    </header>

    <div id="no-data-message" class="text-center py-5 d-none">
        <i class="ph ph-user-circle opacity-50 mb-3" style="font-size: 5rem;"></i>
        <h2>Pas assez de données</h2>
        <p class="text-muted">Ajoutez au moins quelques acteurs à vos favoris pour voir les statistiques.</p>
        <a href="profilUser.html" class="btn btn-primary mt-3">Retour au profil</a>
    </div>

    <div id="stats-content">
        <!-- Résumé rapide -->
        <div class="stat-summary">
            <div class="summary-item">
                <span class="summary-value" id="total-actors">0</span>
                <span class="summary-label">Acteurs Favoris</span>
            </div>
            <div class="summary-item" style="background: linear-gradient(135deg, #ec4899, #8b5cf6);">
                <span class="summary-value" id="avg-age">0</span>
                <span class="summary-label">Âge Moyen</span>
            </div>
            <div class="summary-item" style="background: linear-gradient(135deg, #3b82f6, #2dd4bf);">
                <span class="summary-value" id="most-common-gender">-</span>
                <span class="summary-label">Majorité</span>
            </div>
        </div>

        <div class="row g-4">
            <!-- Graphique Genre -->
            <div class="col-md-6">
                <div class="chart-card">
                    <h3 class="chart-title">Répartition par Genre</h3>
                    <canvas id="genderChart"></canvas>
                </div>
            </div>
            <!-- Graphique Âge -->
            <div class="col-md-6">
                <div class="chart-card">
                    <h3 class="chart-title">Tranches d'Âge</h3>
                    <canvas id="ageChart"></canvas>
                </div>
            </div>
        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="sombre_clair.js"></script>
<script src="actor-stats.js"></script>
</body>
</html>
