<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon Profil - MyCiné Experience</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <!-- Unification via premium-home.css -->
    <link rel="stylesheet" href="premium-home.css">
    <style>
        .profile-hero {
            padding: 140px 5% 60px;
            background: linear-gradient(to bottom, var(--bg-secondary) 0%, var(--bg-primary) 100%);
            border-bottom: 1px solid var(--border);
        }
        .profile-avatar-large {
            width: 120px;
            height: 120px;
            background: linear-gradient(135deg, var(--accent), #f472b6);
            border-radius: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            font-weight: 900;
            color: var(--text-primary);
            box-shadow: 0 15px 35px var(--accent-glow);
        }
        .stat-card {
            background: var(--glass);
            backdrop-filter: blur(15px);
            border: 1px solid var(--border);
            padding: 20px 30px;
            border-radius: 20px;
            text-align: center;
            min-width: 150px;
            transition: 0.3s;
        }
        .stat-card:hover { transform: translateY(-5px); border-color: var(--accent); }
        .stat-val { font-size: 1.8rem; font-weight: 900; color: var(--text-primary); }
        .stat-lbl { font-size: 0.7rem; font-weight: 800; text-transform: uppercase; color: var(--accent); letter-spacing: 1px; }
        
        /* Tabs Premium styling */
        .nav-pills-premium {
            display: flex;
            gap: 10px;
            background: var(--filter-select-bg);
            padding: 8px;
            border-radius: 50px;
            width: fit-content;
            margin: 40px auto;
        }
        .nav-pills-premium .nav-link {
            border-radius: 50px;
            color: var(--text-primary);
            font-weight: 700;
            padding: 10px 25px;
            border: none;
            transition: 0.3s;
            font-size: 0.85rem;
        }
        .nav-pills-premium .nav-link.active {
            background: var(--accent);
            color: #000;
        }

        .section-header-premium {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 30px;
            padding-right: 20px;
        }
        
        /* Grille Verticale 6 colonnes (Standard) */
        .movie-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 20px;
            padding: 20px 0;
        }

        @media (max-width: 1400px) { .movie-grid { grid-template-columns: repeat(5, 1fr); } }
        @media (max-width: 1100px) { .movie-grid { grid-template-columns: repeat(4, 1fr); } }
        @media (max-width: 800px) { .movie-grid { grid-template-columns: repeat(3, 1fr); } }
        @media (max-width: 500px) { .movie-grid { grid-template-columns: repeat(2, 1fr); gap: 15px; } }

        /* Credits Card (Like screenshot) */
        .actor-credit-card {
            position: relative;
            width: 100%;
            aspect-ratio: 2/3;
            border-radius: 15px;
            overflow: hidden;
            cursor: pointer;
            border: 1px solid var(--border);
            transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .actor-credit-card:hover {
            transform: translateY(-10px) scale(1.05);
            border-color: var(--accent);
            z-index: 10;
        }

        .actor-credit-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: 0.5s;
        }

        .actor-credit-card:hover img { transform: scale(1.1); }

        .wide-credit-overlay {
            position: absolute;
            inset: 0;
            background: var(--card-details-bg);
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 15px;
        }

        .wide-title {
            font-weight: 800;
            font-size: 0.85rem;
            color: var(--text-primary);
            margin-bottom: 5px;
            line-height: 1.2;
            text-transform: uppercase;
        }

        .character-badge {
            background: #f1c40f;
            color: #000;
            padding: 1px 8px;
            border-radius: 4px;
            font-size: 0.6rem;
            font-weight: 900;
            text-transform: uppercase;
            width: fit-content;
        }

        .wide-year {
            position: absolute;
            top: 15px;
            right: 15px;
            font-weight: 900;
            font-size: 0.75rem;
            color: var(--text-primary);
            background: var(--glass);
            padding: 2px 8px;
            border-radius: 6px;
            backdrop-filter: blur(5px);
        }

        .remove-btn-premium {
            position: absolute;
            top: 12px; left: 12px;
            width: 32px; height: 32px;
            border-radius: 50%;
            background: rgba(255, 60, 60, 0.2);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #ff3b30;
            display: flex; align-items: center; justify-content: center;
            z-index: 20; transition: 0.3s;
            border: none;
        }
        .remove-btn-premium:hover { background: #ff3b30; color: var(--text-primary); transform: rotate(90deg); }

        .btn-outline-premium {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-primary);
            padding: 8px 20px;
            border-radius: 50px;
            font-weight: 700;
            font-size: 0.75rem;
            transition: 0.3s;
            text-transform: uppercase;
            text-decoration: none;
        }
        .btn-outline-premium:hover { border-color: var(--accent); color: var(--accent); }
        
        .section-wrapper { padding: 0 5% 80px; }
        .lane-title-small { font-size: 0.8rem; font-weight: 800; color: var(--accent); letter-spacing: 2px; text-transform: uppercase; margin-bottom: 20px; opacity: 0.7; }
    </style>
<link rel="stylesheet" href="theme-variables.css">
</head>
<body>

<nav class="navbar navbar-expand-lg fixed-top px-5">
    <div class="container-fluid">
        <a class="navbar-brand d-flex align-items-center gap-2" href="../../index.html" style="font-weight: 900; color: var(--text-primary);">
            <div style="background: linear-gradient(135deg, #a78bfa, #f472b6); width: 32px; height: 32px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 1rem;">M</div>
            MYCINÉ
        </a>
        <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent" aria-controls="navbarContent" aria-expanded="false" aria-label="Toggle navigation">
            <i class="ph ph-list fs-2 text-theme"></i>
        </button>
        <div class="collapse navbar-collapse justify-content-center" id="navbarContent">
            <ul class="navbar-nav gap-4">
                <li class="nav-item"><a class="nav-link fw-bold opacity-50 text-theme" href="../../index.html">ACCUEIL</a></li>
                <li class="nav-item"><a class="nav-link fw-bold opacity-50 text-theme" href="../../PROJET_TM/Films/films.html">FILMS</a></li>
                <li class="nav-item"><a class="nav-link fw-bold opacity-50 text-theme" href="../../series.html">SÉRIES</a></li>
                <li class="nav-item"><a class="nav-link fw-bold opacity-50 text-theme" href="../../PROJET_TM/Films/collections-browse.html">COLLECTIONS</a></li>
                <li class="nav-item"><a class="nav-link fw-bold opacity-50 text-theme" href="../../PROJET_TM/Films/companies-browse.html">STUDIOS</a></li>
            </ul>
        </div>
        <div class="d-flex align-items-center gap-3">
            <button id="theme-toggle" class="btn btn-link text-theme text-decoration-none px-2 d-flex align-items-center" aria-label="Toggle theme">
                <i class="ph ph-moon fs-4" id="theme-icon"></i>
            </button>
            <div id="auth-section">
                <a href="../connexion/connexion.html" class="btn btn-primary rounded-pill px-4 fw-bold btn-sm">CONNEXION</a>
            </div>
            <script>
                (function() {
                    const auth = JSON.parse(sessionStorage.getItem("auth") || localStorage.getItem("lastAuth") || "null");
                    if (auth) {
                        const pseudo = auth.pseudo || auth.username || auth.name || (auth.user && (auth.user.pseudo || auth.user.username)) || "Utilisateur";
                        const c = document.getElementById("auth-section");
                        if (c) {
                            c.innerHTML = `
                                <div class="d-flex align-items-center gap-3">
                                    <div class="text-end d-none d-md-block">
                                        <a href="profilUser.html" class="text-decoration-none text-theme">
                                            <div class="fw-bold small">${pseudo}</div>
                                            <div class="x-small opacity-50">MON PROFIL</div>
                                        </a>
                                    </div>
                                    <button onclick="sessionStorage.removeItem('auth'); localStorage.removeItem('lastAuth'); window.location.href='../connexion/connexion.html';" class="btn btn-outline-danger rounded-pill px-3 btn-sm fw-bold">QUITTER</button>
                                </div>`;
                        }
                    }
                })();
            </script>
        </div>
    </div>
</nav>

<main>
    <!-- Header Premium -->
    <header class="profile-hero">
        <div class="container-fluid">
            <div class="d-flex flex-column flex-md-row align-items-center gap-5">
                <div id="user-avatar" class="profile-avatar-large">?</div>
                <div class="flex-grow-1 text-center text-md-start">
                    <h1 class="hero-title mb-1" id="user-pseudo" style="font-size: 3.5rem;">UTILISATEUR</h1>
                    <p class="opacity-50 fs-5">Membre MyCiné Premium • Collectionneur Passionné</p>
                    <div class="d-flex flex-wrap justify-content-center justify-content-md-start gap-3 mt-4">
                        <div class="stat-card">
                            <div class="stat-val" id="favorites-count">0</div>
                            <div class="stat-lbl">Favoris</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-val" id="watchlist-count">0</div>
                            <div class="stat-lbl">À voir</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-val" id="watched-count">0</div>
                            <div class="stat-lbl">Vus</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <div class="section-wrapper">
        <!-- Tabs Navigation -->
        <ul class="nav nav-pills nav-pills-premium" id="pills-tab" role="tablist">
            <li class="nav-item" role="presentation"><button class="nav-link active" data-bs-toggle="pill" data-bs-target="#pills-fav">FAVORIS</button></li>
            <li class="nav-item" role="presentation"><button class="nav-link" data-bs-toggle="pill" data-bs-target="#pills-watch">WATCHLIST</button></li>
            <li class="nav-item" role="presentation"><button class="nav-link" data-bs-toggle="pill" data-bs-target="#pills-done">DÉJÀ VUS</button></li>
            <li class="nav-item" role="presentation"><button class="nav-link" data-bs-toggle="pill" data-bs-target="#pills-actors">ACTEURS</button></li>
        </ul>

        <!-- Tab Content -->
        <div class="tab-content" id="pills-tabContent">
            <!-- Favoris -->
            <div class="tab-pane fade show active" id="pills-fav">
                <div class="section-header-premium flex-wrap gap-3">
                    <div class="lane-title mb-0">MES COUPS DE CŒUR</div>
                    <div class="d-flex flex-wrap gap-2 align-items-center">
                        <select id="filter-fav-genre" class="btn-outline-premium bg-theme" onchange="appliquerFiltres('favorites')">
                            <option value="">Tous les genres</option>
                            <option value="28">Action</option>
                            <option value="35">Comédie</option>
                            <option value="18">Drame</option>
                            <option value="878">S-Fiction</option>
                            <option value="27">Horreur</option>
                        </select>
                        <select id="sort-fav" class="btn-outline-premium bg-theme" onchange="appliquerFiltres('favorites')">
                            <option value="date-desc">Récent</option>
                            <option value="rating-desc">Mieux notés</option>
                            <option value="title-asc">Nom (A-Z)</option>
                        </select>
                        <button class="btn-outline-premium" id="clear-favorites"><i class="ph ph-trash me-2"></i>VIDER</button>
                    </div>
                </div>
                <div id="favorites-movies" class="movie-grid"></div>
                <div id="favorites-series" class="movie-grid"></div>
            </div>

            <!-- Watchlist -->
            <div class="tab-pane fade" id="pills-watch">
                <div class="section-header-premium flex-wrap gap-3">
                    <div class="lane-title mb-0">À REGARDER PLUS TARD</div>
                    <div class="d-flex flex-wrap gap-2 align-items-center">
                        <select id="filter-watch-genre" class="btn-outline-premium bg-theme" onchange="appliquerFiltres('watchlist')">
                            <option value="">Tous les genres</option>
                            <option value="28">Action</option>
                            <option value="35">Comédie</option>
                            <option value="18">Drame</option>
                        </select>
                        <select id="sort-watch" class="btn-outline-premium bg-theme" onchange="appliquerFiltres('watchlist')">
                            <option value="date-desc">Récent</option>
                            <option value="title-asc">Nom (A-Z)</option>
                        </select>
                    </div>
                </div>
                <div id="watchlist-movies" class="movie-grid"></div>
                <div id="watchlist-series" class="movie-grid"></div>
            </div>

            <!-- Vus -->
            <div class="tab-pane fade" id="pills-done">
                <div class="section-header-premium flex-wrap gap-3">
                    <div class="lane-title mb-0">HISTORIQUE DE VISIONNAGE</div>
                    <div class="d-flex flex-wrap gap-2 align-items-center">
                        <select id="filter-watched-genre" class="btn-outline-premium bg-theme" onchange="appliquerFiltres('watched')">
                            <option value="">Tous les genres</option>
                            <option value="28">Action</option>
                            <option value="18">Drame</option>
                        </select>
                        <select id="sort-watched" class="btn-outline-premium bg-theme" onchange="appliquerFiltres('watched')">
                            <option value="date-desc">Récent</option>
                            <option value="rating-desc">Mieux notés</option>
                        </select>
                    </div>
                </div>
                <div id="watched-movies" class="movie-grid"></div>
                <div id="watched-series" class="movie-grid"></div>
            </div>

            <!-- Acteurs -->
            <div class="tab-pane fade" id="pills-actors">
                <div class="section-header-premium flex-wrap gap-3">
                    <div class="lane-title mb-0">STARS PRÉFÉRÉES</div>
                    
                    <!-- Actor Filters & Sort -->
                    <div class="d-flex flex-wrap gap-2 align-items-center">
                        <select id="filter-actor-sex" class="btn-outline-premium bg-theme" onchange="appliquerFiltresActeurs()">
                            <option value="">Tous les sexes</option>
                            <option value="1">Femmes</option>
                            <option value="2">Hommes</option>
                        </select>
                        <select id="filter-actor-age" class="btn-outline-premium bg-theme" onchange="appliquerFiltresActeurs()">
                            <option value="">Tous les âges</option>
                            <option value="0-30">- 30 ans</option>
                            <option value="30-50">30-50 ans</option>
                            <option value="50-100">+ 50 ans</option>
                        </select>
                        <select id="sort-actor" class="btn-outline-premium bg-theme" onchange="appliquerFiltresActeurs()">
                            <option value="name-asc">Nom (A-Z)</option>
                            <option value="name-desc">Nom (Z-A)</option>
                            <option value="age-asc">Âge (Croissant)</option>
                            <option value="age-desc">Âge (Décroissant)</option>
                        </select>
                        <a href="actor-stats.html" class="btn-outline-premium"><i class="ph ph-chart-pie me-2"></i>STATISTIQUES</a>
                    </div>
                </div>
                <div id="actors-favorites" class="movie-grid"></div>
            </div>
        </div>
    </div>
</main>

<div id="toast-container" class="toast-container position-fixed bottom-0 end-0 p-4"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="profilUser.js"></script>
<script>
    window.onscroll = () => {
        const nav = document.querySelector('.navbar');
        if (window.scrollY > 50) nav.classList.add('scrolled');
        else nav.classList.remove('scrolled');
    };
</script>
<script src="../theme.js"></script>
</body>
</html>
