<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon Profil - MyCiné Experience</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <!-- Unification via premium-home.css -->
    <link rel="stylesheet" href="premium-home.css">
    <style>
        .profile-hero {
            padding: 140px 5% 60px;
            background: linear-gradient(to bottom, #101010 0%, #050505 100%);
            border-bottom: 1px solid var(--border);
        }
        .profile-avatar-large {
            width: 120px;
            height: 120px;
            background: linear-gradient(135deg, var(--accent), #f472b6);
            border-radius: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            font-weight: 900;
            color: #fff;
            box-shadow: 0 15px 35px var(--accent-glow);
        }
        .stat-card {
            background: var(--glass);
            backdrop-filter: blur(15px);
            border: 1px solid var(--border);
            padding: 20px 30px;
            border-radius: 20px;
            text-align: center;
            min-width: 150px;
            transition: 0.3s;
        }
        .stat-card:hover { transform: translateY(-5px); border-color: var(--accent); }
        .stat-val { font-size: 1.8rem; font-weight: 900; color: #fff; }
        .stat-lbl { font-size: 0.7rem; font-weight: 800; text-transform: uppercase; color: var(--accent); letter-spacing: 1px; }
        
        /* Tabs Premium styling */
        .nav-pills-premium {
            display: flex;
            gap: 10px;
            background: rgba(255,255,255,0.05);
            padding: 8px;
            border-radius: 50px;
            width: fit-content;
            margin: 40px auto;
        }
        .nav-pills-premium .nav-link {
            border-radius: 50px;
            color: #fff;
            font-weight: 700;
            padding: 10px 25px;
            border: none;
            transition: 0.3s;
            font-size: 0.85rem;
        }
        .nav-pills-premium .nav-link.active {
            background: var(--accent);
            color: #000;
        }

        .section-header-premium {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 30px;
            padding-right: 20px;
        }
        
        /* Grille 6 colonnes standard */
        .movie-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 20px;
            padding-bottom: 40px;
        }
        @media (max-width: 1400px) { .movie-grid { grid-template-columns: repeat(5, 1fr); } }
        @media (max-width: 1100px) { .movie-grid { grid-template-columns: repeat(4, 1fr); } }
        @media (max-width: 800px) { .movie-grid { grid-template-columns: repeat(3, 1fr); } }
        @media (max-width: 500px) { .movie-grid { grid-template-columns: repeat(2, 1fr); } }

        /* Acteurs Portrait Grid */
        .actor-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 20px;
        }
        .actor-portrait {
            aspect-ratio: 2/3;
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid var(--border);
            position: relative;
            cursor: pointer;
            transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .actor-portrait:hover { transform: translateY(-10px) scale(1.03); border-color: var(--accent); }
        .actor-portrait img { width: 100%; height: 100%; object-fit: cover; }
        
        .remove-btn-premium {
            position: absolute;
            top: 12px; right: 12px;
            width: 32px; height: 32px;
            border-radius: 50%;
            background: rgba(255, 60, 60, 0.2);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #ff3b30;
            display: flex; align-items: center; justify-content: center;
            z-index: 10; transition: 0.3s;
        }
        .remove-btn-premium:hover { background: #ff3b30; color: #fff; transform: rotate(90deg); }

        .btn-outline-premium {
            background: transparent;
            border: 1px solid var(--border);
            color: #fff;
            padding: 8px 20px;
            border-radius: 50px;
            font-weight: 700;
            font-size: 0.75rem;
            transition: 0.3s;
            text-transform: uppercase;
        }
        .btn-outline-premium:hover { border-color: var(--accent); color: var(--accent); }
        
        .section-wrapper { padding: 0 5% 80px; }
        .lane-title-small { font-size: 0.8rem; font-weight: 800; color: var(--accent); letter-spacing: 2px; text-transform: uppercase; margin-bottom: 20px; opacity: 0.7; }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg fixed-top px-5">
    <div class="container-fluid">
        <a class="navbar-brand d-flex align-items-center gap-2" href="../../index.html" style="font-weight: 900; color: #fff;">
            <div style="background: linear-gradient(135deg, #a78bfa, #f472b6); width: 32px; height: 32px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 1rem;">M</div>
            MYCINÉ
        </a>
        <div class="collapse navbar-collapse justify-content-center">
            <ul class="navbar-nav gap-4">
                <li class="nav-item"><a class="nav-link fw-bold opacity-50 text-white" href="../../index.html">ACCUEIL</a></li>
                <li class="nav-item"><a class="nav-link fw-bold opacity-50 text-white" href="films.html">FILMS</a></li>
                <li class="nav-item"><a class="nav-link fw-bold opacity-50 text-white" href="../../series.html">SÉRIES</a></li>
            </ul>
        </div>
        <div id="auth-section"></div>
    </div>
</nav>

<main>
    <!-- Header Premium -->
    <header class="profile-hero">
        <div class="container-fluid">
            <div class="d-flex flex-column flex-md-row align-items-center gap-5">
                <div id="user-avatar" class="profile-avatar-large">?</div>
                <div class="flex-grow-1 text-center text-md-start">
                    <h1 class="hero-title mb-1" id="user-pseudo" style="font-size: 3.5rem;">UTILISATEUR</h1>
                    <p class="opacity-50 fs-5">Membre MyCiné Premium • Collectionneur Passionné</p>
                    <div class="d-flex flex-wrap justify-content-center justify-content-md-start gap-3 mt-4">
                        <div class="stat-card">
                            <div class="stat-val" id="favorites-count">0</div>
                            <div class="stat-lbl">Favoris</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-val" id="watchlist-count">0</div>
                            <div class="stat-lbl">À voir</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-val" id="watched-count">0</div>
                            <div class="stat-lbl">Vus</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <div class="section-wrapper">
        <!-- Tabs Navigation -->
        <ul class="nav nav-pills nav-pills-premium" id="pills-tab" role="tablist">
            <li class="nav-item" role="presentation"><button class="nav-link active" data-bs-toggle="pill" data-bs-target="#pills-fav">FAVORIS</button></li>
            <li class="nav-item" role="presentation"><button class="nav-link" data-bs-toggle="pill" data-bs-target="#pills-watch">WATCHLIST</button></li>
            <li class="nav-item" role="presentation"><button class="nav-link" data-bs-toggle="pill" data-bs-target="#pills-done">DÉJÀ VUS</button></li>
            <li class="nav-item" role="presentation"><button class="nav-link" data-bs-toggle="pill" data-bs-target="#pills-actors">ACTEURS</button></li>
        </ul>

        <!-- Tab Content -->
        <div class="tab-content" id="pills-tabContent">
            <!-- Favoris -->
            <div class="tab-pane fade show active" id="pills-fav">
                <div class="section-header-premium">
                    <div class="lane-title mb-0">MES COUPS DE CŒUR</div>
                    <button class="btn-outline-premium" id="clear-favorites"><i class="ph ph-trash me-2"></i>VIDER TOUT</button>
                </div>
                <div class="lane-title-small">FILMS</div>
                <div id="favorites-movies" class="movie-grid"></div>
                <div class="lane-title-small">SÉRIES</div>
                <div id="favorites-series" class="movie-grid"></div>
            </div>

            <!-- Watchlist -->
            <div class="tab-pane fade" id="pills-watch">
                <div class="section-header-premium"><div class="lane-title mb-0">À REGARDER PLUS TARD</div></div>
                <div class="lane-title-small">FILMS</div>
                <div id="watchlist-movies" class="movie-grid"></div>
                <div class="lane-title-small">SÉRIES</div>
                <div id="watchlist-series" class="movie-grid"></div>
            </div>

            <!-- Vus -->
            <div class="tab-pane fade" id="pills-done">
                <div class="section-header-premium"><div class="lane-title mb-0">HISTORIQUE DE VISIONNAGE</div></div>
                <div class="lane-title-small">FILMS</div>
                <div id="watched-movies" class="movie-grid"></div>
                <div class="lane-title-small">SÉRIES</div>
                <div id="watched-series" class="movie-grid"></div>
            </div>

            <!-- Acteurs -->
            <div class="tab-pane fade" id="pills-actors">
                <div class="section-header-premium">
                    <div class="lane-title mb-0">STARS PRÉFÉRÉES</div>
                    <a href="actor-stats.html" class="btn-outline-premium"><i class="ph ph-chart-pie me-2"></i>STATISTIQUES</a>
                </div>
                <div id="actors-favorites" class="actor-grid"></div>
            </div>
        </div>
    </div>
</main>

<div id="toast-container" class="toast-container position-fixed bottom-0 end-0 p-4"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="profilUser.js"></script>
<script>
    window.onscroll = () => {
        const nav = document.querySelector('.navbar');
        if (window.scrollY > 50) nav.classList.add('scrolled');
        else nav.classList.remove('scrolled');
    };
</script>
</body>
</html>
