<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catalogue de Distribution - MyCiné</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="cinema-premium.css">
    <link rel="stylesheet" href="premium-home.css">
    <link rel="stylesheet" href="theme-variables.css">
    <style>
        .distributor-hero {
            position: relative;
            min-height: 450px;
            padding: 140px 5% 50px;
            background: linear-gradient(to bottom, var(--bg-secondary) 0%, var(--bg-primary) 100%);
            border-bottom: 1px solid var(--border);
            overflow: hidden;
        }

        .distributor-hero-backdrop {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.15;
            filter: blur(20px);
            z-index: 0;
        }

        .distributor-logo-header {
            max-height: 100px;
            max-width: 250px;
            object-fit: contain;
            background: rgba(255, 255, 255, 0.95);
            padding: 15px 25px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .stat-badge-card {
            background: var(--glass);
            backdrop-filter: blur(15px);
            border: 1px solid var(--border);
            padding: 18px 25px;
            border-radius: 20px;
            text-align: center;
        }
        .stat-badge-val { font-size: 1.6rem; font-weight: 900; color: var(--text-primary); }
        .stat-badge-lbl { font-size: 0.7rem; font-weight: 800; text-transform: uppercase; color: var(--accent); letter-spacing: 1px; }

        .movie-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
            gap: 20px;
            padding: 20px 0;
            width: 100%;
        }
        @media (min-width: 2560px) { .movie-grid { grid-template-columns: repeat(10, 1fr); } }
        @media (min-width: 2200px) and (max-width: 2559px) { .movie-grid { grid-template-columns: repeat(9, 1fr); } }
        @media (min-width: 1920px) and (max-width: 2199px) { .movie-grid { grid-template-columns: repeat(8, 1fr); } }
        @media (min-width: 1650px) and (max-width: 1919px) { .movie-grid { grid-template-columns: repeat(7, 1fr); } }
        @media (min-width: 1400px) and (max-width: 1649px) { .movie-grid { grid-template-columns: repeat(6, 1fr); } }
        @media (min-width: 1150px) and (max-width: 1399px) { .movie-grid { grid-template-columns: repeat(5, 1fr); } }
        @media (min-width: 900px) and (max-width: 1149px) { .movie-grid { grid-template-columns: repeat(4, 1fr); } }
        @media (min-width: 650px) and (max-width: 899px) { .movie-grid { grid-template-columns: repeat(3, 1fr); } }
        @media (max-width: 649px) { .movie-grid { grid-template-columns: repeat(2, 1fr); gap: 12px; } }


        .partner-chip {
            background: rgba(167, 139, 250, 0.15);
            border: 1px solid var(--accent);
            color: var(--text-primary);
            padding: 6px 14px;
            border-radius: 50px;
            font-size: 0.8rem;
            font-weight: 700;
        }

        .section-wrapper { padding: 40px 5% 80px; }
    </style>
</head>
<body>

<!-- Unified Navbar -->
<nav class="navbar navbar-expand-lg fixed-top px-5">
    <div class="container-fluid">
        <a class="navbar-brand d-flex align-items-center gap-2" href="../../index.html" style="font-weight: 900; color: var(--text-primary);">
            <div style="background: linear-gradient(135deg, #a78bfa, #f472b6); width: 32px; height: 32px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 1rem;">M</div>
            MYCINÉ
        </a>
        <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent" aria-controls="navbarContent" aria-expanded="false" aria-label="Toggle navigation">
            <i class="ph ph-list fs-2 text-theme"></i>
        </button>
        <div class="collapse navbar-collapse justify-content-center" id="navbarContent">
            <ul class="navbar-nav gap-4">
                <li class="nav-item"><a class="nav-link fw-bold opacity-50 text-theme" href="../../index.html">ACCUEIL</a></li>
                <li class="nav-item"><a class="nav-link fw-bold opacity-50 text-theme" href="films.html">FILMS</a></li>
                <li class="nav-item"><a class="nav-link fw-bold opacity-50 text-theme" href="../../series.html">SÉRIES</a></li>
                <li class="nav-item"><a class="nav-link fw-bold opacity-50 text-theme" href="collections-browse.html">COLLECTIONS</a></li>
                <li class="nav-item"><a class="nav-link fw-bold opacity-50 text-theme" href="companies-browse.html">STUDIOS</a></li>
                <li class="nav-item"><a class="nav-link fw-bold active text-theme" href="distributors-browse.html">DISTRIBUTEURS</a></li>
            </ul>
        </div>
        <div class="d-flex align-items-center gap-3">
            <button id="theme-toggle" class="btn btn-link text-theme text-decoration-none px-2 d-flex align-items-center" aria-label="Toggle theme">
                <i class="ph ph-moon fs-4" id="theme-icon"></i>
            </button>
            <div id="auth-section">
                <a href="../connexion/connexion.html" class="btn btn-primary rounded-pill px-4 fw-bold btn-sm">CONNEXION</a>
            </div>
            <script>
                (function() {
                    const auth = JSON.parse(sessionStorage.getItem("auth") || localStorage.getItem("lastAuth") || "null");
                    if (auth) {
                        const pseudo = auth.pseudo || auth.username || auth.name || (auth.user && (auth.user.pseudo || auth.user.username)) || "Utilisateur";
                        const c = document.getElementById("auth-section");
                        if (c) {
                            c.innerHTML = `
                                <div class="d-flex align-items-center gap-3">
                                    <div class="text-end d-none d-md-block">
                                        <a href="profilUser.html" class="text-decoration-none text-theme">
                                            <div class="fw-bold small">${pseudo}</div>
                                            <div class="x-small opacity-50">MON PROFIL</div>
                                        </a>
                                    </div>
                                    <button onclick="sessionStorage.removeItem('auth'); localStorage.removeItem('lastAuth'); window.location.reload();" class="btn btn-outline-danger rounded-pill px-4 btn-sm fw-bold">QUITTER</button>
                                </div>`;
                        }
                    }
                })();
            </script>
        </div>
    </div>
</nav>

<!-- Hero Section -->
<header class="distributor-hero">
    <img id="hero-backdrop-img" class="distributor-hero-backdrop" src="https://via.placeholder.com/1920x1080">
    <div class="container-fluid position-relative" style="z-index: 2;">
        <div class="d-flex align-items-center gap-4 flex-wrap mb-4">
            <div id="distributor-logo-wrapper">
                <img id="distributor-logo" class="distributor-logo-header" src="" alt="Logo Distributeur" style="display: none;">
            </div>
            <div>
                <h1 class="hero-title mb-1" id="distributor-name" style="font-size: 3rem;">Société de Distribution</h1>
                <p class="opacity-75 fs-5 mb-0" id="distributor-description">Catalogue des films distribués au cinéma et sur plateforme.</p>
            </div>
        </div>

        <!-- Partenaires & Stats -->
        <div class="d-flex justify-content-between align-items-center flex-wrap gap-3 mt-4">
            <div id="distributor-partners" class="d-flex flex-wrap gap-2 align-items-center"></div>

            <div class="d-flex align-items-center gap-3">
                <div class="btn-group rounded-pill p-1 shadow-sm" style="background: rgba(255,255,255,0.08); border: 1px solid var(--border);" id="media-type-toggle">
                    <button id="btn-media-movie" class="btn btn-sm rounded-pill fw-bold active btn-primary px-3" onclick="setMediaType('movie')">
                        <i class="ph ph-film-strip me-1"></i> FILMS
                    </button>
                    <button id="btn-media-tv" class="btn btn-sm rounded-pill fw-bold btn-outline-secondary text-theme px-3" onclick="setMediaType('tv')">
                        <i class="ph ph-television me-1"></i> SÉRIES
                    </button>
                </div>

                <div class="stat-badge-card">
                    <div class="stat-badge-val" id="stat-total-movies">0</div>
                    <div class="stat-badge-lbl" id="stat-label-count">Titres Distribués</div>
                </div>
                <div class="stat-badge-card" id="stat-card-revenue">
                    <div class="stat-badge-val text-accent" id="stat-total-revenue">0 $</div>
                    <div class="stat-badge-lbl">Recettes Cumulées</div>
                </div>
            </div>
        </div>
    </div>
</header>

<main class="section-wrapper">
    <!-- Barre de Filtres & Tri -->
    <div class="card p-3 mb-4 border-0 shadow-sm" style="background: var(--glass); backdrop-filter: blur(15px); border: 1px solid var(--border) !important; border-radius: 20px;">
        <div class="row g-3 align-items-center">
            <div class="col-md-3">
                <label class="x-small fw-extrabold text-accent uppercase mb-1 d-block"><i class="ph ph-mask-happy me-1"></i> GENRE DE CONTENU</label>
                <select id="filter-genre" class="form-select form-select-sm rounded-pill border-0 text-theme" style="background: rgba(255,255,255,0.08);" onchange="applyFilters()">
                    <option value="">Tous les genres</option>
                    <option value="28">Action</option>
                    <option value="12">Aventure</option>
                    <option value="16">Animation</option>
                    <option value="35">Comédie</option>
                    <option value="80">Crime</option>
                    <option value="99">Documentaire</option>
                    <option value="18">Drame</option>
                    <option value="10751">Familial</option>
                    <option value="14">Fantastique</option>
                    <option value="36">Histoire</option>
                    <option value="27">Horreur</option>
                    <option value="10402">Musique</option>
                    <option value="9648">Mystère</option>
                    <option value="10749">Romance</option>
                    <option value="878">Science-Fiction</option>
                    <option value="53">Thriller</option>
                    <option value="10752">Guerre</option>
                    <option value="37">Western</option>
                </select>
            </div>

            <div class="col-md-3">
                <label class="x-small fw-extrabold text-accent uppercase mb-1 d-block"><i class="ph ph-calendar me-1"></i> ANNÉE DE SORTIE</label>
                <select id="filter-year" class="form-select form-select-sm rounded-pill border-0 text-theme" style="background: rgba(255,255,255,0.08);" onchange="applyFilters()">
                    <option value="">Toutes les années</option>
                </select>
            </div>

            <div class="col-md-6 text-md-end mt-3 mt-md-0">
                <label class="x-small fw-extrabold text-accent uppercase mb-1 d-block"><i class="ph ph-sort-ascending me-1"></i> TRIER PAR</label>
                <div class="d-flex align-items-center justify-content-md-end gap-2 flex-wrap">
                    <button class="btn btn-primary btn-sm rounded-pill fw-bold active sort-btn" data-sort="popularity.desc" onclick="setSort('popularity.desc')">Populaires</button>
                    <button class="btn btn-outline-secondary btn-sm rounded-pill fw-bold text-theme sort-btn" id="btn-sort-revenue" data-sort="revenue.desc" onclick="setSort('revenue.desc')">Box-Office</button>
                    <button class="btn btn-outline-secondary btn-sm rounded-pill fw-bold text-theme sort-btn" data-sort="vote_average.desc" onclick="setSort('vote_average.desc')">Mieux Notés</button>
                    <button class="btn btn-outline-secondary btn-sm rounded-pill fw-bold text-theme sort-btn" data-sort="primary_release_date.desc" onclick="setSort('primary_release_date.desc')">Plus Récents</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Grille des films -->
    <div class="movie-grid" id="distributed-movies-grid">
        <div class="text-center py-5 w-100" style="grid-column: 1 / -1;">
            <div class="spinner-border text-theme" role="status">
                <span class="visually-hidden">Chargement des films...</span>
            </div>
        </div>
    </div>

    <!-- Bouton Charger Plus -->
    <div class="text-center mt-5">
        <button id="btn-load-more" class="btn btn-outline-premium rounded-pill px-5 py-3 fw-bold" onclick="loadMoreMovies()">
            CHARGER PLUS DE FILMS <i class="ph ph-plus-circle ms-2 fs-5"></i>
        </button>
    </div>
</main>

<footer class="py-5 text-center border-top border-secondary mt-5 opacity-50">
    <p class="small fw-bold">© 2026 MYCINÉ • EXPERIENCE PREMIUM</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="distributor-details.js?v=3"></script>
<script>
    window.onscroll = () => {
        const nav = document.querySelector('.navbar');
        if (window.scrollY > 50) nav.classList.add('scrolled');
        else nav.classList.remove('scrolled');
    };
</script>
<script src="../theme.js"></script>
</body>
</html>
