<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Talent - MyCiné Experience</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="premium-home.css">
    <style>
        .hero-slider { height: 75vh; }
        .hero-info { bottom: 10%; max-width: 900px; }
        .hero-desc { 
            font-size: 1.1rem; 
            line-height: 1.6; 
            opacity: 0.8; 
            margin-bottom: 30px;
            display: -webkit-box;
            -webkit-line-clamp: 4;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        
        .side-panel {
            position: absolute;
            right: 5%;
            bottom: 10%;
            width: 320px;
            background: var(--glass);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 25px;
            z-index: 20;
        }

        .side-item { margin-bottom: 20px; }
        .side-label { font-size: 0.7rem; font-weight: 800; color: var(--accent); letter-spacing: 2px; text-transform: uppercase; margin-bottom: 8px; }
        .side-value { font-size: 1.1rem; font-weight: 700; color: var(--text-primary); }

        .btn-circle {
            width: 55px; height: 55px;
            border-radius: 50%;
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--border);
            color: var(--text-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
            transition: 0.3s;
        }
        .btn-circle:hover { background: var(--accent); color: #000; border-color: var(--accent); }
        .btn-circle.active { background: var(--accent); color: #000; }

        .actor-photo-main {
            width: 280px;
            aspect-ratio: 2/3;
            border-radius: 20px;
            border: 1px solid var(--border);
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            position: absolute;
            right: 5%;
            bottom: 15%;
            z-index: 5;
            object-fit: cover;
        }

        /* Grille Verticale 6 colonnes (Unified) */
        .movie-grid, .filmography-list {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 20px;
            padding: 20px 0;
        }

        @media (max-width: 1400px) { .movie-grid, .filmography-list { grid-template-columns: repeat(5, 1fr); } }
        @media (max-width: 1100px) { .movie-grid, .filmography-list { grid-template-columns: repeat(4, 1fr); } }
        @media (max-width: 800px) { .movie-grid, .filmography-list { grid-template-columns: repeat(3, 1fr); } }
        @media (max-width: 500px) { .movie-grid, .filmography-list { grid-template-columns: repeat(2, 1fr); gap: 15px; } }

        .actor-credit-card {
            position: relative;
            width: 100%;
            aspect-ratio: 2/3;
            border-radius: 15px;
            overflow: hidden;
            cursor: pointer;
            border: 1px solid rgba(255,255,255,0.1);
            transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .actor-credit-card:hover {
            transform: translateY(-10px) scale(1.05);
            border-color: var(--accent);
            z-index: 10;
        }

        .actor-credit-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: 0.5s;
        }

        .actor-credit-card:hover img { transform: scale(1.1); }

        .wide-credit-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.9) 0%, transparent 70%);
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 15px;
        }

        .wide-title {
            font-weight: 800;
            font-size: 0.85rem;
            color: var(--text-primary);
            margin-bottom: 5px;
            line-height: 1.2;
            text-transform: uppercase;
        }

        .character-badge {
            background: #f1c40f;
            color: #000;
            padding: 1px 8px;
            border-radius: 4px;
            font-size: 0.6rem;
            font-weight: 900;
            text-transform: uppercase;
            width: fit-content;
        }

        .wide-year {
            position: absolute;
            top: 15px;
            right: 15px;
            font-weight: 900;
            font-size: 0.75rem;
            color: var(--text-primary);
            background: rgba(0,0,0,0.5);
            padding: 2px 8px;
            border-radius: 6px;
            backdrop-filter: blur(5px);
        }

        .section-header-bar {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 30px;
        }

        .section-bar {
            width: 4px;
            height: 24px;
            background: var(--accent);
            border-radius: 2px;
        }

        .tech-footer {
            padding: 60px 5%;
            background: #000;
            border-top: 1px solid var(--border);
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 50px;
        }
        .tech-col-title { font-size: 0.75rem; font-weight: 900; color: var(--accent); text-transform: uppercase; margin-bottom: 20px; letter-spacing: 1px; }
    </style>
<link rel="stylesheet" href="theme-variables.css">
</head>
<body>

<nav class="navbar navbar-expand-lg fixed-top px-5">
    <div class="container-fluid">
        <a class="navbar-brand d-flex align-items-center gap-2" href="../../index.html" style="font-weight: 900; color: var(--text-primary);">
            <div style="background: linear-gradient(135deg, #a78bfa, #f472b6); width: 32px; height: 32px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 1rem;">M</div>
            MYCINÉ
        </a>
        <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent" aria-controls="navbarContent" aria-expanded="false" aria-label="Toggle navigation">
            <i class="ph ph-list fs-2 text-theme"></i>
        </button>
        <div class="collapse navbar-collapse justify-content-center" id="navbarContent">
            <ul class="navbar-nav gap-4">
                <li class="nav-item"><a class="nav-link fw-bold opacity-50 text-theme" href="../../index.html">ACCUEIL</a></li>
                <li class="nav-item"><a class="nav-link fw-bold opacity-50 text-theme" href="../../PROJET_TM/Films/films.html">FILMS</a></li>
                <li class="nav-item"><a class="nav-link fw-bold opacity-50 text-theme" href="../../series.html">SÉRIES</a></li>
                <li class="nav-item"><a class="nav-link fw-bold opacity-50 text-theme" href="../../PROJET_TM/Films/collections-browse.html">COLLECTIONS</a></li>
                <li class="nav-item"><a class="nav-link fw-bold opacity-50 text-theme" href="../../PROJET_TM/Films/companies-browse.html">STUDIOS</a></li>
            </ul>
        </div>
        <div class="d-flex align-items-center gap-3">
            <button id="theme-toggle" class="btn btn-link text-theme text-decoration-none px-2 d-flex align-items-center" aria-label="Toggle theme">
                <i class="ph ph-moon fs-4" id="theme-icon"></i>
            </button>
            <div id="auth-section">
                <a href="../../PROJET_TM/connexion/connexion.html" class="btn btn-primary rounded-pill px-4 fw-bold btn-sm">CONNEXION</a>
            </div>
        </div>
    </div>
</nav>

<main>
    <!-- Immersive Header -->
    <header class="hero-slider">
        <div class="hero-slide active">
            <img id="hero-backdrop" src="https://images.unsplash.com/photo-1485846234645-a62644f84728?auto=format&fit=crop&q=80&w=2000" class="hero-backdrop" style="filter: brightness(0.3) blur(20px);">
            <div class="hero-overlay-top"></div>
            <div class="hero-overlay-bottom"></div>
            
            <div class="hero-info">
                <nav aria-label="breadcrumb" class="mb-4 opacity-50">
                    <ol class="breadcrumb m-0" style="font-size: 0.8rem; font-weight: 800;">
                        <li class="breadcrumb-item"><a href="../../index.html" class="text-theme text-decoration-none">MYCINÉ</a></li>
                        <li class="breadcrumb-item active text-theme text-uppercase">TALENT</li>
                    </ol>
                </nav>
                <h1 id="actor-name" class="hero-title">...</h1>
                <div id="actor-tags" class="d-flex gap-3 fw-bold opacity-75 mb-4"></div>
                <p id="actor-biography" class="hero-desc"></p>
                
                <div class="d-flex align-items-center gap-3">
                    <button id="add-actor-to-favorites" class="btn btn-light rounded-pill px-5 py-3 fw-black"><i class="ph ph-heart me-2"></i> SUIVRE CET ARTISTE</button>
                    <div id="external-ids" class="d-flex gap-2"></div>
                </div>
            </div>

            <img id="actor-photo" src="" class="actor-photo-main d-none d-lg-block">
        </div>
    </header>

    <!-- Content Sections -->
    <section class="content-lane">
        <div class="lane-title">CONNU POUR</div>
        <div id="known-for" class="movie-grid mb-5"></div>
    </section>

    <section class="content-lane pt-0">
        <div class="section-header-bar">
            <div class="section-bar"></div>
            <div class="lane-title mb-0" style="font-size: 1.5rem;">FILMOGRAPHIE COMPLÈTE</div>
        </div>
        
        <ul class="nav nav-pills mb-4 gap-2" style="background: rgba(255,255,255,0.05); padding: 8px; border-radius: 50px; width: fit-content;">
            <li class="nav-item"><button class="nav-link active rounded-pill text-theme fw-bold" data-bs-toggle="tab" data-bs-target="#tab-movies">FILMS</button></li>
            <li class="nav-item"><button class="nav-link rounded-pill text-theme fw-bold" data-bs-toggle="tab" data-bs-target="#tab-tv">SÉRIES TV</button></li>
        </ul>
        <div class="tab-content">
            <div class="tab-pane fade show active" id="tab-movies">
                <div id="actor-movies" class="filmography-list"></div>
            </div>
            <div class="tab-pane fade" id="tab-tv">
                <div id="actor-tv" class="filmography-list"></div>
            </div>
        </div>
    </section>

    <!-- Info Footer -->
    <footer class="tech-footer">
        <div class="tech-col">
            <div class="tech-col-title">Informations Personnelles</div>
            <div class="mb-3">
                <div class="x-small opacity-50">Date de naissance</div>
                <div id="actor-birthday" class="fw-bold fs-5">...</div>
            </div>
            <div>
                <div class="x-small opacity-50">Lieu de naissance</div>
                <div id="actor-birthplace" class="fw-bold fs-6">...</div>
            </div>
        </div>
        <div class="tech-col">
            <div class="tech-col-title">Statistiques</div>
            <div class="mb-3">
                <div class="x-small opacity-50">Films total</div>
                <div id="movie-count" class="fw-bold fs-5 text-accent">...</div>
            </div>
        </div>
        <div class="tech-col ms-auto text-end">
            <p class="x-small opacity-25">© 2026 MYCINÉ TALENT PROFILE</p>
        </div>
    </footer>
</main>

<div id="toast-container" class="toast-container position-fixed bottom-0 end-0 p-4"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="actor-details.js"></script>
<script>
    window.onscroll = () => {
        const nav = document.querySelector('.navbar');
        if (window.scrollY > 50) nav.classList.add('scrolled');
        else nav.classList.remove('scrolled');
    };
</script>
<script src="../theme.js"></script>
</body>
</html>
