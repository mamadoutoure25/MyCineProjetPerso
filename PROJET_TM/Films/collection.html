<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyCine</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/phosphor-icons@1.4.2/src/css/icons.css">
    <link rel="stylesheet" href="collection.css">
    <link rel="stylesheet" href="premium-home.css">
    <script>
        (function () {
            try {
                var saved = localStorage.getItem("theme");
                var system = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
                document.documentElement.setAttribute("data-theme", saved || system);
            } catch (e) {
                document.documentElement.setAttribute("data-theme", "dark");
            }
        })();
    </script>
<link rel="stylesheet" href="theme-variables.css">

    <style>
        /* Exact Premium Card Grid Matching index.html dimensions */
        .movie-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 25px;
            justify-content: center;
        }
        .movie-grid .premium-card {
            width: 100% !important;
            min-width: 0 !important;
            max-width: 220px !important;
            margin: 0 auto;
        }
        @media (max-width: 1400px) { .movie-grid { grid-template-columns: repeat(5, 1fr); } }
        @media (max-width: 1100px) { .movie-grid { grid-template-columns: repeat(4, 1fr); } }
        @media (max-width: 800px) { .movie-grid { grid-template-columns: repeat(3, 1fr); } }
        @media (max-width: 500px) { .movie-grid { grid-template-columns: repeat(2, 1fr); gap: 15px; } }
    </style>
        
</head>
<body>
<nav class="navbar navbar-expand-lg fixed-top px-5">
    <div class="container-fluid">
        <a class="navbar-brand d-flex align-items-center gap-2" href="../../index.html" style="font-weight: 900; color: var(--text-primary);">
            <div style="background: linear-gradient(135deg, #a78bfa, #f472b6); width: 32px; height: 32px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 1rem;">M</div>
            MYCINÉ
        </a>
        <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent" aria-controls="navbarContent" aria-expanded="false" aria-label="Toggle navigation">
            <i class="ph ph-list fs-2 text-theme"></i>
        </button>
        <div class="collapse navbar-collapse justify-content-center" id="navbarContent">
            <ul class="navbar-nav gap-4">
                <li class="nav-item"><a class="nav-link fw-bold opacity-50 text-theme" href="../../index.html">ACCUEIL</a></li>
                <li class="nav-item"><a class="nav-link fw-bold opacity-50 text-theme" href="../../PROJET_TM/Films/films.html">FILMS</a></li>
                <li class="nav-item"><a class="nav-link fw-bold opacity-50 text-theme" href="../../series.html">SÉRIES</a></li>
                <li class="nav-item"><a class="nav-link fw-bold opacity-50 text-theme" href="../../PROJET_TM/Films/collections-browse.html">COLLECTIONS</a></li>
                <li class="nav-item"><a class="nav-link fw-bold opacity-50 text-theme" href="../../PROJET_TM/Films/companies-browse.html">STUDIOS</a></li>
            </ul>
        </div>
        <div class="d-flex align-items-center gap-3">
            <button id="theme-toggle" class="btn btn-link text-theme text-decoration-none px-2 d-flex align-items-center" aria-label="Toggle theme">
                <i class="ph ph-moon fs-4" id="theme-icon"></i>
            </button>
            <div id="auth-section">
                <a href="../../PROJET_TM/connexion/connexion.html" class="btn btn-primary rounded-pill px-4 fw-bold btn-sm">CONNEXION</a>
            </div>
        </div>
    </div>
</nav>

<section id="collection-hero" class="hero-section">
    <div class="hero-overlay"></div>
    <div class="container collection-info">
        <div class="row align-items-center g-4">
            <div class="col-md-3">
                <img id="collection-poster" src="https://via.placeholder.com/300x450?text=Aucune+affiche" alt="Collection Poster" class="img-fluid rounded shadow">
            </div>
            <div class="col-md-9">
                <h1 id="collection-title" class="hero-title mb-3"></h1>
                <p id="collection-overview" class="hero-description mb-4"></p>
                <div class="d-flex flex-wrap gap-3">
                    <span class="badge rounded-pill" id="movies-count">0 films</span>
                    <span class="badge rounded-pill" id="collection-years">Annees inconnues</span>
                    <span class="badge rounded-pill" id="collection-revenue">Non divulgue</span>
                </div>
            </div>
        </div>
    </div>
</section>

<section class="content-section" id="collection-content">
    <div class="container-fluid px-md-4 px-3">
        <h2 class="section-title">Distribution en vedette</h2>
        <div id="collection-cast" class="people-grid mb-5"></div>

        <h2 class="section-title">Equipe en vedette</h2>
        <div id="collection-crew" class="people-grid mb-5"></div>

        <div class="section-header">
            <h2 class="section-title mb-0">Films de la collection</h2>
        </div>
        <div id="movies-grid" class="movies-grid" style="display: none;"></div>

        <div id="loading" class="text-center py-4">
            <div class="spinner-border" role="status">
                <span class="visually-hidden">Chargement...</span>
            </div>
        </div>
    </div>
</section>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
