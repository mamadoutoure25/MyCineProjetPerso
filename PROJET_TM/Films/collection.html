<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyCine</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">

    <link rel="stylesheet" href="collection.css">
    <link rel="stylesheet" href="premium-home.css">
    <script>
        (function () {
            try {
                var saved = localStorage.getItem("theme");
                var system = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
                document.documentElement.setAttribute("data-theme", saved || system);
            } catch (e) {
                document.documentElement.setAttribute("data-theme", "dark");
            }
        })();
    </script>
<link rel="stylesheet" href="theme-variables.css">

    <style>
        /* Exact Premium Card Grid Matching index.html dimensions */
        .movie-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 25px;
            justify-content: center;
        }
        .movie-grid .premium-card {
            width: 100% !important;
            min-width: 0 !important;
            max-width: 220px !important;
            margin: 0 auto;
        }
        @media (max-width: 1400px) { .movie-grid { grid-template-columns: repeat(5, 1fr); } }
        @media (max-width: 1100px) { .movie-grid { grid-template-columns: repeat(4, 1fr); } }
        @media (max-width: 800px) { .movie-grid { grid-template-columns: repeat(3, 1fr); } }
        @media (max-width: 500px) { .movie-grid { grid-template-columns: repeat(2, 1fr); gap: 15px; } }

        /* Distribution en vedette - Grille 6 colonnes */
        #collection-cast, .movie-grid-6 {
            display: grid !important;
            grid-template-columns: repeat(6, 1fr) !important;
            gap: 20px !important;
            padding: 20px 0 !important;
            overflow-x: visible !important;
            width: 100% !important;
        }

        @media (max-width: 1400px) { #collection-cast, .movie-grid-6 { grid-template-columns: repeat(5, 1fr) !important; } }
        @media (max-width: 1100px) { #collection-cast, .movie-grid-6 { grid-template-columns: repeat(4, 1fr) !important; } }
        @media (max-width: 800px) { #collection-cast, .movie-grid-6 { grid-template-columns: repeat(3, 1fr) !important; } }
        @media (max-width: 500px) { #collection-cast, .movie-grid-6 { grid-template-columns: repeat(2, 1fr) !important; gap: 12px !important; } }

        .small-actor-card {
            position: relative;
            width: 100% !important;
            min-width: 0 !important;
            max-width: none !important;
            aspect-ratio: 2/3;
            border-radius: 16px;
            overflow: hidden;
            cursor: pointer;
            border: 1px solid var(--border);
            transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .small-actor-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: 0.5s;
        }

        .actor-hover-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0.2) 100%);
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 15px;
            opacity: 0;
            transition: 0.3s;
            text-align: center;
        }

        .small-actor-card:hover {
            transform: translateY(-10px) scale(1.03);
            border-color: var(--accent);
            box-shadow: 0 15px 30px rgba(0,0,0,0.6);
        }

        .small-actor-card:hover img { transform: scale(1.1); }
        .small-actor-card:hover .actor-hover-overlay { opacity: 1; }

        .actor-name { font-size: 0.85rem; font-weight: 800; color: var(--text-primary); margin-bottom: 4px; line-height: 1.2; }
        .actor-role { font-size: 0.75rem; color: var(--accent); font-weight: 600; opacity: 0.9; }
    </style>
        
</head>

<section id="collection-hero" class="hero-section">
    <div class="hero-overlay"></div>
    <div class="container collection-info">
        <div class="row align-items-center g-4">
            <div class="col-md-3">
                <img id="collection-poster" src="https://via.placeholder.com/300x450?text=Aucune+affiche" alt="Collection Poster" class="img-fluid rounded shadow">
            </div>
            <div class="col-md-9">
                <h1 id="collection-title" class="hero-title mb-3"></h1>
                <p id="collection-overview" class="hero-description mb-4"></p>
                <div class="d-flex flex-wrap gap-3">
                    <span class="badge rounded-pill" id="movies-count">0 films</span>
                    <span class="badge rounded-pill" id="collection-years">Annees inconnues</span>
                    <span class="badge rounded-pill" id="collection-revenue">Non divulgue</span>
                </div>
            </div>
        </div>
    </div>
</section>

<section class="content-section" id="collection-content">
    <div class="container-fluid px-md-4 px-3">
        <h2 class="section-title">Distribution en vedette</h2>
        <div id="collection-cast" class="movie-grid-6 mb-5"></div>

        <h2 class="section-title">Equipe en vedette</h2>
        <div id="collection-crew" class="people-grid mb-5"></div>

        <div class="section-header">
            <h2 class="section-title mb-0">Films de la collection</h2>
        </div>
        <div id="movies-grid" class="movies-grid mb-5" style="display: none;"></div>

        <section class="mb-5">
            <h2 class="section-title">MÉDIAS & GALERIE</h2>
            <ul class="nav nav-pills mb-4 gap-2" style="background: rgba(255,255,255,0.05); padding: 8px; border-radius: 50px; width: fit-content;">
                <li class="nav-item"><button class="nav-link active rounded-pill text-theme fw-bold" data-bs-toggle="tab" data-bs-target="#tab-back">IMAGES</button></li>
                <li class="nav-item"><button class="nav-link rounded-pill text-theme fw-bold" data-bs-toggle="tab" data-bs-target="#tab-post">AFFICHES</button></li>
            </ul>
            <div class="tab-content">
                <div class="tab-pane fade show active" id="tab-back"><div id="grid-backdrops" class="movie-grid-6"></div></div>
                <div class="tab-pane fade" id="tab-post"><div id="grid-posters" class="movie-grid-6"></div></div>
            </div>
        </section>

        <div id="loading" class="text-center py-4">
            <div class="spinner-border" role="status">
                <span class="visually-hidden">Chargement...</span>
            </div>
        </div>
    </div>
</section>

<div class="modal fade" id="mediaModal" tabindex="-1" aria-hidden="true">

</div>
