<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyCiné - Saison Experience</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="premium-home.css">
    <style>
        .hero-slider { height: 65vh; }
        .hero-info { bottom: 15%; }
        
        /* Episode Premium Card */
        .ep-card-premium {
            background: var(--glass);
            backdrop-filter: blur(15px);
            border: 1px solid var(--border);
            border-radius: 24px;
            overflow: hidden;
            display: flex;
            margin-bottom: 30px;
            transition: 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            cursor: pointer;
        }
        .ep-card-premium:hover {
            transform: translateX(15px) scale(1.01);
            border-color: var(--accent);
            background: rgba(40, 40, 40, 0.4);
        }
        .ep-thumb-wrap {
            width: 350px;
            aspect-ratio: 16/9;
            flex-shrink: 0;
            position: relative;
            overflow: hidden;
        }
        .ep-thumb-wrap img { width: 100%; height: 100%; object-fit: cover; transition: 0.6s; }
        .ep-card-premium:hover .ep-thumb-wrap img { transform: scale(1.1); }
        
        .ep-content { padding: 30px; flex-grow: 1; display: flex; flex-direction: column; justify-content: center; }
        .ep-meta-top { color: var(--accent); font-weight: 900; font-size: 0.8rem; letter-spacing: 2px; margin-bottom: 10px; text-transform: uppercase; }
        .ep-title-main { font-weight: 800; font-size: 1.4rem; margin-bottom: 12px; color: var(--text-primary); }
        .ep-desc-main { color: var(--text-dim); font-size: 1rem; line-height: 1.6; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
        
        .ep-footer-meta { margin-top: 20px; display: flex; gap: 20px; font-size: 0.85rem; font-weight: 700; opacity: 0.6; }

        /* Distribution Grille Ultra-Responsive */
        .movie-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 15px;
            padding: 20px 0;
            width: 100%;
        }

        @media (min-width: 2560px) { .movie-grid { grid-template-columns: repeat(12, 1fr); } }
        @media (min-width: 2200px) and (max-width: 2559px) { .movie-grid { grid-template-columns: repeat(10, 1fr); } }
        @media (min-width: 1920px) and (max-width: 2199px) { .movie-grid { grid-template-columns: repeat(9, 1fr); } }
        @media (min-width: 1600px) and (max-width: 1919px) { .movie-grid { grid-template-columns: repeat(8, 1fr); } }
        @media (min-width: 1300px) and (max-width: 1599px) { .movie-grid { grid-template-columns: repeat(7, 1fr); } }
        @media (min-width: 1000px) and (max-width: 1299px) { .movie-grid { grid-template-columns: repeat(6, 1fr); } }
        @media (min-width: 700px) and (max-width: 999px) { .movie-grid { grid-template-columns: repeat(4, 1fr); } }
        @media (min-width: 450px) and (max-width: 699px) { .movie-grid { grid-template-columns: repeat(3, 1fr); } }
        @media (max-width: 449px) { .movie-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; } }


        .small-actor-card {
            position: relative;
            width: 100% !important;
            min-width: 0 !important;
            max-width: none !important;
            aspect-ratio: 2/3;
            border-radius: 16px;
            overflow: hidden;
            cursor: pointer;
            border: 1px solid var(--border);
            transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .small-actor-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: 0.5s;
        }

        .actor-hover-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0.2) 100%);
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 15px;
            opacity: 0;
            transition: 0.3s;
            text-align: center;
        }

        .small-actor-card:hover {
            transform: translateY(-10px) scale(1.03);
            border-color: var(--accent);
            box-shadow: 0 15px 30px rgba(0,0,0,0.6);
        }

        .small-actor-card:hover img { transform: scale(1.1); }
        .small-actor-card:hover .actor-hover-overlay { opacity: 1; }

        .actor-name { font-size: 0.85rem; font-weight: 800; color: var(--text-primary); margin-bottom: 4px; line-height: 1.2; }
        .actor-role { font-size: 0.75rem; color: var(--accent); font-weight: 600; opacity: 0.9; }
    </style>
<link rel="stylesheet" href="theme-variables.css">
</head>
<body>

<nav class="navbar navbar-expand-lg fixed-top px-5">
    <div class="container-fluid">
        <a class="navbar-brand d-flex align-items-center gap-2" href="../../index.html" style="font-weight: 900; color: var(--text-primary);">
            <div style="background: linear-gradient(135deg, #a78bfa, #f472b6); width: 32px; height: 32px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 1rem;">M</div>
            MYCINÉ
        </a>
        <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent" aria-controls="navbarContent" aria-expanded="false" aria-label="Toggle navigation">
            <i class="ph ph-list fs-2 text-theme"></i>
        </button>
        <div class="collapse navbar-collapse justify-content-center" id="navbarContent">
            <ul class="navbar-nav gap-4">
                <li class="nav-item"><a class="nav-link fw-bold opacity-50 text-theme" href="../../index.html">ACCUEIL</a></li>
                <li class="nav-item"><a class="nav-link fw-bold opacity-50 text-theme" href="../../PROJET_TM/Films/films.html">FILMS</a></li>
                <li class="nav-item"><a class="nav-link fw-bold opacity-50 text-theme" href="../../series.html">SÉRIES</a></li>
                <li class="nav-item"><a class="nav-link fw-bold opacity-50 text-theme" href="../../PROJET_TM/Films/collections-browse.html">COLLECTIONS</a></li>
                <li class="nav-item"><a class="nav-link fw-bold opacity-50 text-theme" href="../../PROJET_TM/Films/companies-browse.html">STUDIOS</a></li>
            </ul>
        </div>
        <div class="d-flex align-items-center gap-3">
            <button id="theme-toggle" class="btn btn-link text-theme text-decoration-none px-2 d-flex align-items-center" aria-label="Toggle theme">
                <i class="ph ph-moon fs-4" id="theme-icon"></i>
            </button>
            <div id="auth-section">
                <a href="../connexion/connexion.html" class="btn btn-primary rounded-pill px-4 fw-bold btn-sm">CONNEXION</a>
            </div>
            <script>
                (function() {
                    const auth = JSON.parse(sessionStorage.getItem("auth") || localStorage.getItem("lastAuth") || "null");
                    if (auth) {
                        const pseudo = auth.pseudo || auth.username || auth.name || (auth.user && (auth.user.pseudo || auth.user.username)) || "Utilisateur";
                        const c = document.getElementById("auth-section");
                        if (c) {
                            c.innerHTML = `
                                <div class="d-flex align-items-center gap-3">
                                    <div class="text-end d-none d-md-block">
                                        <a href="profilUser.html" class="text-decoration-none text-theme">
                                            <div class="fw-bold small">${pseudo}</div>
                                            <div class="x-small opacity-50">MON PROFIL</div>
                                        </a>
                                    </div>
                                    <button onclick="sessionStorage.removeItem('auth'); localStorage.removeItem('lastAuth'); window.location.reload();" class="btn btn-outline-danger rounded-pill px-4 btn-sm fw-bold">QUITTER</button>
                                </div>`;
                        }
                    }
                })();
            </script>
        </div>
    </div>
</nav>

<main>
    <!-- Cinematic Hero -->
    <section class="hero-slider">
        <div class="hero-slide active" style="min-height: 450px; display: flex; align-items: flex-end; padding-bottom: 50px;">
            <img id="season-backdrop" src="" class="hero-backdrop">
            <div class="hero-overlay-top"></div>
            <div class="hero-overlay-bottom"></div>
            
            <div class="hero-info" style="z-index: 10;">
                <nav aria-label="breadcrumb" class="mb-3 opacity-50">
                    <ol class="breadcrumb m-0" style="font-size: 0.8rem; font-weight: 800;">
                        <li class="breadcrumb-item"><a href="../../series.html" class="text-theme text-decoration-none">SÉRIES</a></li>
                        <li class="breadcrumb-item"><a id="serie-link" href="#" class="text-theme text-decoration-none">SÉRIE</a></li>
                        <li class="breadcrumb-item active text-theme" id="breadcrumb-season">SAISON</li>
                    </ol>
                </nav>
                <h1 id="season-title" class="hero-title" style="font-size: 3rem;">...</h1>
                <div id="season-tags" class="d-flex gap-3 fw-bold opacity-75 mb-4"></div>
                <p id="season-overview" class="hero-desc" style="max-width: 800px;"></p>
            </div>
            
            <div style="position: absolute; right: 5%; bottom: 15%; width: 220px;" class="d-none d-lg-block">
                <img id="season-poster" src="" class="rounded-4 shadow-lg" style="width: 100%; aspect-ratio: 2/3; object-fit: cover; border: 1px solid var(--border);">
            </div>
        </div>
    </section>

    <!-- Episodes Section -->
    <section class="content-lane">
        <div class="lane-title">ÉPISODES DE LA SAISON</div>
        <div id="episodes-container" class="mt-4">
            <!-- Injected by JS -->
        </div>
    </section>

    <!-- Season Cast -->
    <section class="content-lane pt-0">
        <div class="lane-title">DISTRIBUTION DE LA SAISON</div>
        <div id="season-cast" class="movie-grid"></div>
    </section>
</main>

<footer class="py-5 text-center border-top border-secondary mt-5 opacity-50">
    <p class="small fw-bold">© 2026 MYCINÉ • SAISON EXPERIENCE PREMIUM</p>
</footer>

<div id="toast-container" class="toast-container position-fixed bottom-0 end-0 p-4"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="saison-details.js?v=2"></script>
<script>
    window.onscroll = () => {
        const nav = document.querySelector('.navbar');
        if (window.scrollY > 50) nav.classList.add('scrolled');
        else nav.classList.remove('scrolled');
    };
</script>
<script src="../theme.js"></script>
</body>
</html>
